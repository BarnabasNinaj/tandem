<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Tandem — private, local-first household financial operating system." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Tandem</title>
    <link
      rel="preload"
      href="/fonts/fugaz-one.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/auth-shell.css" />
    <style>
      @font-face {
        font-family: 'Fugaz One';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('/fonts/fugaz-one.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 700;
        font-display: block;
        src: url('/fonts/plus-jakarta-sans-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 700;
        font-display: block;
        src: url('/fonts/plus-jakarta-sans-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      html {
        scrollbar-gutter: stable;
      }
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }
      body {
        background: linear-gradient(165deg, #f4f7f6 0%, #e8eeec 45%, #dfe8e5 100%);
        color: #1c1917;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      html.dark body {
        background: linear-gradient(165deg, #0c1210 0%, #141a18 50%, #1a2220 100%);
        color: #f5f5f4;
      }
    </style>
    <script>
      try {
        if (localStorage.getItem('tandem.theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function hasGithub() {
          try {
            var raw = localStorage.getItem('tandem.github')
            if (!raw) return false
            var c = JSON.parse(raw)
            return !!(c && c.username && c.repo && c.pat)
          } catch (_) {
            return false
          }
        }
        function hasSessionPassword() {
          try {
            return !!sessionStorage.getItem('tandem.sk')
          } catch (_) {
            return false
          }
        }
        if (!hasGithub() || hasSessionPassword()) return
        var root = document.getElementById('root')
        if (!root) return
        // Same class names as React AuthShell + LockScreen (public/auth-shell.css).
        root.innerHTML =
          '<div class="auth-shell">' +
          '<div class="auth-shell-bg" aria-hidden="true"></div>' +
          '<div class="auth-shell-inner">' +
          '<p class="auth-logo">Tandem</p>' +
          '<p class="auth-tagline">Private, local-first household operating system. Your vault unlocks only in this browser.</p>' +
          '<div class="auth-card">' +
          '<div class="auth-status">' +
          '<svg class="auth-status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' +
          '<span>Vault locked</span></div>' +
          '<div class="auth-field">' +
          '<label class="auth-label" for="static-lock-input">Master password</label>' +
          '<input id="static-lock-input" class="auth-input" type="password" placeholder="Enter master password" autocomplete="current-password" disabled />' +
          '</div>' +
          '<button class="auth-btn" type="button" disabled>Unlock</button>' +
          '</div></div></div>'
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
